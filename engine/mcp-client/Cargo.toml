[package]
name = "odex-mcp-client"
description = "Odex MCP client: stdio + Streamable HTTP transports, OAuth, schema sanitizing for vLLM chat templates."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
odex-protocol.workspace = true
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
futures.workspace = true
async-trait.workspace = true
reqwest.workspace = true
tracing.workspace = true
sha2.workspace = true
hex.workspace = true
base64.workspace = true
rand.workspace = true
url.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
axum.workspace = true
tempfile.workspace = true

# Tiny stdio MCP server used by the integration tests (`CARGO_BIN_EXE_odex-mcp-test-server`).
[[bin]]
name = "odex-mcp-test-server"
path = "tests/support/test_server.rs"
test = false
doc = false
