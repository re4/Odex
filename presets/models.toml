family = "deepseek"
match = ["*deepseek-v3.1*", "*deepseek-v3.2*", "*deepseek-v3*"]
serve = "vllm serve deepseek-ai/DeepSeek-V3.1 --enable-auto-tool-choice --tool-call-parser deepseek_v31 --reasoning-parser deepseek_v3 --max-model-len 131072 --enable-prefix-caching"
