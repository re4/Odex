[presets.glm-4v.settings]
temperature = 0.6
top_p = 0.95
max_output_tokens = 8192
coordinate_space = "normalized_1000"
tool_call_format = "glm45"
capabilities = { tools = true, vision = true, parallel_tools = false, reasoning = true }

[presets.glm-4]
display_name = "GLM-4.5 / 4.6 / 4.7"
family = "glm"
match = ["*glm-4.5*", "*glm-4.6*", "*glm-4.7*", "*glm-5*"]
