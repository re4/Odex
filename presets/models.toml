[presets.glm-4.settings]
temperature = 0.6
top_p = 0.95
max_output_tokens = 16384
tool_profile = "extended"
reasoning_history = "current_turn"
tool_call_format = "glm45"
default_reasoning_effort = "medium"
capabilities = { tools = true, vision = false, parallel_tools = true, reasoning = true }
[presets.glm-4.settings.reasoning_effort_map]
none = { chat_template_kwargs = { enable_thinking = false } }
minimal = { chat_template_kwargs = { enable_thinking = false } }
low = { chat_template_kwargs = { enable_thinking = true } }
medium = { chat_template_kwargs = { enable_thinking = true } }
high = { chat_template_kwargs = { enable_thinking = true } }

[presets.gpt-oss]
display_name = "gpt-oss"
family = "gpt-oss"
match = ["*gpt-oss*"]
serve = "vllm serve openai/gpt-oss-20b --enable-auto-tool-choice --tool-call-parser openai --reasoning-parser openai_gptoss --max-model-len 131072 --enable-prefix-caching"
notes = "Harmony format. Reasoning effort maps to the `reasoning_effort` request field."
[presets.gpt-oss.settings]
temperature = 1.0
top_p = 1.0
max_output_tokens = 16384
tool_profile = "extended"
reasoning_history = "current_turn"
default_reasoning_effort = "medium"
capabilities = { tools = true, vision = false, parallel_tools = false, reasoning = true }
[presets.gpt-oss.settings.reasoning_effort_map]
low = { reasoning_effort = "low" }
medium = { reasoning_effort = "medium" }
high = { reasoning_effort = "high" }

