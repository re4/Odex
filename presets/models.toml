# Odex model presets for self-hosted models served by vLLM.
#
# Each preset carries known-good per-model settings plus the `vllm serve`
# flags it needs. A configured or discovered model inherits the FIRST preset
# whose `match` glob matches its served model id (case-insensitive), unless
# `[models.<key>] preset = "..."` picks one explicitly. Order matters: more
# specific presets come first.
#
# Parser names were verified against vLLM v0.30.0 (2026-09) and the vLLM
# recipes; see docs/research/vllm-flags.md and docs/vllm-setup.md.
# Rules of thumb:
#   * never set --reasoning-parser on non-thinking models (output would land in `reasoning`)
#   * sampling is sent explicitly per request (vLLM never takes presence_penalty from the model)

[presets.qwen3-coder-next]
display_name = "Qwen3-Coder-Next"
family = "qwen3-coder"
match = ["*qwen3-coder-next*"]
serve = "vllm serve Qwen/Qwen3-Coder-Next --enable-auto-tool-choice --tool-call-parser qwen3_coder --max-model-len 131072 --enable-prefix-caching"
notes = "Non-thinking. Needs vLLM >= 0.15."
[presets.qwen3-coder-next.settings]
temperature = 1.0
top_p = 0.95
top_k = 40
max_output_tokens = 16384
tool_profile = "extended"
reasoning_history = "drop"
tool_call_format = "qwen3_coder"
capabilities = { tools = true, vision = false, parallel_tools = true, reasoning = false }

[presets.qwen3-coder]
display_name = "Qwen3-Coder"
family = "qwen3-coder"
match = ["*qwen3-coder*"]
serve = "vllm serve Qwen/Qwen3-Coder-30B-A3B-Instruct --enable-auto-tool-choice --tool-call-parser qwen3_coder --max-model-len 131072 --enable-prefix-caching"
notes = "Non-thinking agentic coder (do not set a reasoning parser). 256k native context; drop --max-model-len to 32768 if memory is tight."
[presets.qwen3-coder.settings]
temperature = 0.7
top_p = 0.8
top_k = 20
repetition_penalty = 1.05
max_output_tokens = 16384
tool_profile = "extended"
reasoning_history = "drop"
tool_call_format = "qwen3_coder"
capabilities = { tools = true, vision = false, parallel_tools = true, reasoning = false }

[presets.qwen3-vl]
display_name = "Qwen3-VL"
family = "qwen3-vl"
match = ["*qwen3-vl*", "*qwen2.5-vl*"]
serve = "vllm serve Qwen/Qwen3-VL-30B-A3B-Instruct --enable-auto-tool-choice --tool-call-parser hermes --max-model-len 128000 --limit-mm-per-prompt.video 0 --enable-prefix-caching"
notes = "Vision role. Grounds UI elements in normalized 0-1000 coordinates. Thinking variants add --reasoning-parser qwen3 (vLLM >= 0.17) or deepseek_r1."
[presets.qwen3-vl.settings]
temperature = 0.7
top_p = 0.8
top_k = 20
repetition_penalty = 1.0
presence_penalty = 1.5
max_output_tokens = 8192
tool_profile = "extended"
coordinate_space = "normalized_1000"
max_image_px = 1600
tool_call_format = "hermes"
capabilities = { tools = true, vision = true, parallel_tools = true, reasoning = false }

[presets.qwen3_5]
display_name = "Qwen3.5 / 3.6"
family = "qwen3"
match = ["*qwen3.5*", "*qwen3.6*", "*qwen3.8*"]
serve = "vllm serve Qwen/Qwen3.6-35B-A3B --trust-remote-code --enable-auto-tool-choice --tool-call-parser qwen3_coder --reasoning-parser qwen3 --max-model-len 131072 --enable-prefix-caching"
notes = "Thinks by default; needs vLLM >= 0.17. Add --language-model-only to skip the vision encoder. Sampling below is the vendor's 'precise coding' profile."
[presets.qwen3_5.settings]
temperature = 0.6
top_p = 0.95
top_k = 20
min_p = 0.0
presence_penalty = 0.0
repetition_penalty = 1.0
max_output_tokens = 32768
tool_profile = "extended"
reasoning_history = "current_turn"
tool_call_format = "qwen3_coder"
default_reasoning_effort = "medium"
capabilities = { tools = true, vision = false, parallel_tools = true, reasoning = true }
[presets.qwen3_5.settings.reasoning_effort_map]
none = { chat_template_kwargs = { enable_thinking = false } }
minimal = { chat_template_kwargs = { enable_thinking = false } }
low = { chat_template_kwargs = { enable_thinking = true } }
medium = { chat_template_kwargs = { enable_thinking = true } }
high = { chat_template_kwargs = { enable_thinking = true } }
xhigh = { chat_template_kwargs = { enable_thinking = true } }

[presets.qwen3-thinking]
display_name = "Qwen3 Thinking (2507 / Next)"
family = "qwen3"
match = ["*qwen3-*thinking*"]
serve = "vllm serve Qwen/Qwen3-30B-A3B-Thinking-2507 --enable-auto-tool-choice --tool-call-parser hermes --reasoning-parser deepseek_r1 --max-model-len 131072 --enable-prefix-caching"
notes = "Thinking-only. On vLLM >= 0.17 --reasoning-parser qwen3 also works; older qwen3 parser leaves the thought in content."
[presets.qwen3-thinking.settings]
temperature = 0.6
top_p = 0.95
top_k = 20
min_p = 0.0
max_output_tokens = 32768
tool_profile = "extended"
reasoning_history = "current_turn"
tool_call_format = "hermes"
capabilities = { tools = true, vision = false, parallel_tools = true, reasoning = true }

