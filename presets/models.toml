# Odex model presets for self-hosted models served by vLLM.
#
# Each preset carries known-good per-model settings plus the `vllm serve`
# flags it needs. A configured or discovered model inherits the first preset
# whose `match` glob matches its served model id (case-insensitive), unless
# `[models.<key>] preset = "..."` picks one explicitly.
#
# Parser names were checked against the vLLM docs/source; see
# docs/research/vllm-flags.md and docs/vllm-setup.md.

[presets.qwen3-coder]
display_name = "Qwen3-Coder"
family = "qwen3-coder"
match = ["*qwen3-coder*"]
serve = "vllm serve Qwen/Qwen3-Coder-30B-A3B-Instruct --enable-auto-tool-choice --tool-call-parser qwen3_coder --max-model-len 131072 --enable-prefix-caching"
notes = "Non-thinking agentic coder. 256k native context; 128k is a good default on 2x24GB."
[presets.qwen3-coder.settings]
temperature = 0.7
top_p = 0.8
top_k = 20
repetition_penalty = 1.05
max_output_tokens = 16384
tool_profile = "extended"
reasoning_history = "drop"
tool_call_format = "qwen3_coder"
capabilities = { tools = true, vision = false, parallel_tools = true, reasoning = false }

[presets.qwen3-vl]
display_name = "Qwen3-VL"
family = "qwen3-vl"
match = ["*qwen3-vl*", "*qwen2.5-vl*"]
serve = "vllm serve Qwen/Qwen3-VL-30B-A3B-Instruct --enable-auto-tool-choice --tool-call-parser hermes --max-model-len 65536 --limit-mm-per-prompt.image 4 --enable-prefix-caching"
notes = "Vision role. Grounds UI elements in normalized 0-1000 coordinates."
[presets.qwen3-vl.settings]
temperature = 0.7
top_p = 0.8
top_k = 20
max_output_tokens = 8192
tool_profile = "extended"
coordinate_space = "normalized_1000"
max_image_px = 1600
tool_call_format = "hermes"
capabilities = { tools = true, vision = true, parallel_tools = true, reasoning = false }

[presets.qwen3-thinking]
display_name = "Qwen3 (thinking)"
family = "qwen3"
match = ["*qwen3-*thinking*", "*qwen3-next*thinking*", "qwen/qwen3-32b*", "qwen/qwen3-14b*", "qwen/qwen3-8b*", "qwen/qwen3-30b-a3b", "qwen/qwen3-235b-a22b", "*qwen3.5*"]
serve = "vllm serve Qwen/Qwen3-30B-A3B-Thinking-2507 --enable-auto-tool-choice --tool-call-parser hermes --reasoning-parser qwen3 --max-model-len 131072 --enable-prefix-caching"
notes = "Hybrid/thinking Qwen3. Thinking can be disabled per request with chat_template_kwargs.enable_thinking=false."
[presets.qwen3-thinking.settings]
temperature = 0.6
top_p = 0.95
top_k = 20
min_p = 0.0
max_output_tokens = 32768
tool_profile = "extended"
reasoning_history = "current_turn"
tool_call_format = "hermes"
default_reasoning_effort = "medium"
capabilities = { tools = true, vision = false, parallel_tools = true, reasoning = true }
[presets.qwen3-thinking.settings.reasoning_effort_map]
none = { chat_template_kwargs = { enable_thinking = false } }
minimal = { chat_template_kwargs = { enable_thinking = false } }
low = { chat_template_kwargs = { enable_thinking = true } }
medium = { chat_template_kwargs = { enable_thinking = true } }
high = { chat_template_kwargs = { enable_thinking = true } }

[presets.qwen3-instruct]
display_name = "Qwen3 Instruct (2507)"
family = "qwen3"
match = ["*qwen3-*instruct*", "*qwen3-next*instruct*"]
serve = "vllm serve Qwen/Qwen3-30B-A3B-Instruct-2507 --enable-auto-tool-choice --tool-call-parser hermes --max-model-len 131072 --enable-prefix-caching"
[presets.qwen3-instruct.settings]
temperature = 0.7
top_p = 0.8
top_k = 20
min_p = 0.0
max_output_tokens = 16384
tool_profile = "extended"
reasoning_history = "drop"
tool_call_format = "hermes"
capabilities = { tools = true, vision = false, parallel_tools = true, reasoning = false }

[presets.glm-4v]
display_name = "GLM-4.5V"
family = "glm"
match = ["*glm-4.5v*", "*glm-4.1v*", "*glm-4.6v*"]
